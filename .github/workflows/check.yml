name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  overlays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: book overlay
        working-directory: book
        run: python3 -B pdf-overlay/tools/check_generated.py
      - name: book annotations (Literature Links scan)
        run: PYTHONPATH=book/pdf-overlay/tools python3 -B -m literature_links scan book/annotations
      - name: paper-2013 overlay
        working-directory: paper-2013
        run: python3 -B pdf-overlay/tools/check_generated.py
      - name: paper-2013 annotations (Literature Links scan)
        run: PYTHONPATH=paper-2013/pdf-overlay/tools python3 -B -m literature_links scan paper-2013/annotations
